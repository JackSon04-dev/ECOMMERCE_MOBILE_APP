<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Test Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --chat-bg: #ffffff;
            --user-msg: #4f46e5;
            --bot-msg: #f3f4f6;
            --text-color: #111827;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 80vh;
            background-color: var(--chat-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 1rem;
        }

        .chat-header {
            padding: 1.25rem;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header h1 {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .chat-header .status {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
        }

        #chat-window {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.9375rem;
            line-height: 1.5;
            position: relative;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-color);
            border-bottom-left-radius: 0.25rem;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        /* Product Card Styles */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .product-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 0.375rem;
            background-color: #f3f4f6;
        }

        .product-info h3 {
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-info p {
            font-size: 0.75rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .chat-input {
            padding: 1.25rem;
            background-color: white;
            border-top: 1px solid #f3f4f6;
            display: flex;
            gap: 0.75rem;
        }

        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            outline: none;
            font-size: 0.9375rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button svg {
            width: 20px;
            height: 20px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-reply-btn {
            background-color: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s;
            width: auto;
            height: auto;
        }

        .quick-reply-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.4); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="status"></div>
            <h1>AI Ecommerce Chatbot</h1>
        </div>
        <div id="chat-window">
            <div class="message bot">
                Chào bạn! Shop mình có bán các sảm phẩm sau, bạn cần tìm gì ạ?<br>
                <div class="quick-replies">
                    <button class="quick-reply-btn" onclick="sendQuickReply('áo')">Áo</button>
                    <button class="quick-reply-btn" onclick="sendQuickReply('quần')">Quần</button>
                    <button class="quick-reply-btn" onclick="sendQuickReply('giày')">Giày</button>
                </div>
            </div>
        </div>
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function sendQuickReply(text) {
            userInput.value = text;
            chatForm.querySelector('button[type="submit"]').click();
        }

        function appendMessage(text, isUser, products = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.textContent = text;
            chatWindow.appendChild(messageDiv);

            if (products && products.length > 0) {
                const productGrid = document.createElement('div');
                productGrid.className = 'product-grid';
                
                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${p.thumbnail || 'https://via.placeholder.com/150'}" class="product-image" alt="${p.name}">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p>${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price)}</p>
                        </div>
                    `;
                    card.onclick = () => alert(`Đang xem sản phẩm: ${p.name}`);
                    productGrid.appendChild(card);
                });
                
                chatWindow.appendChild(productGrid);
            }

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, true);
            userInput.value = '';

            // Loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot loading';
            loadingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatWindow.appendChild(loadingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                chatWindow.removeChild(loadingDiv);
                appendMessage(data.reply, false, data.products);
            } catch (error) {
                chatWindow.removeChild(loadingDiv);
                appendMessage('Lỗi: Không thể kết nối với server. Hãy chắc chắn rằng bạn đã chạy server AI.', false);
                console.error('Error:', error);
            }
        };
    </script>
</body>
</html>
