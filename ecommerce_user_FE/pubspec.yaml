name: ecommerce
description: "A new Flutter project."
version: 1.0.4+5
publish_to: 'none'

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # 1. Giao tiếp mạng & Định tuyến
  http: ^1.2.2
  url_launcher: ^6.3.2

  # 2. Quản lý trạng thái (State Management)
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2

  # 3. Lưu trữ & Bảo mật & Môi trường
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_dotenv: ^6.0.0

  # 4. Xác thực người dùng
  google_sign_in: ^6.2.1

  # 5. Firebase & Thông báo đẩy (Push Notification)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # 6. Giao diện (UI/UX) & Hoạt ảnh & Icon
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  flutter_slidable: ^3.1.1
  flutter_animate: ^4.5.2

  # 7. Tính năng Camera & Media
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0

  # 8. Tiện ích (Utilities) & Hệ thống
  intl: ^0.17.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
