version: '3.8'

services:
  # 1. Redis Caching Service (Chay noi bo trong Docker Compose)
  redis:
    image: redis:7-alpine
    container_name: local_redis
    networks:
      - ecommerce_local_net

  # 2. Backend Express.js
  backend:
    build:
      context: ./ecommerce_backend
      dockerfile: Dockerfile
    container_name: local_backend
    env_file:
      - ./ecommerce_backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - ecommerce_local_net

  # 3. RabbitMQ Message Queue Service
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: local_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ecommerce_local_net

  # 4. Background Worker (Consumer)
  worker:
    build:
      context: ./ecommerce_backend
      dockerfile: Dockerfile
    container_name: local_worker
    command: ["node", "worker.js"]
    env_file:
      - ./ecommerce_backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - ecommerce_local_net

  # 5. Chatbot AI FastAPI
  chatbot:
    build:
      context: ./chatbotAI
      dockerfile: Dockerfile
    container_name: local_chatbot
    networks:
      - ecommerce_local_net

  # 6. Static Admin Web Panel Vue 3 (Host tren cong 8080 - Cổng vào duy nhất của hệ thống)
  admin_web:
    build:
      context: ./ecommerce_admin_FE
      dockerfile: Dockerfile
    container_name: local_admin_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - chatbot # Đảm bảo Chatbot cũng khởi chạy trước
    networks:
      - ecommerce_local_net

networks:
  ecommerce_local_net:
    driver: bridge