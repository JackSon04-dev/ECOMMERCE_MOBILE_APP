version: '3.8'

services:
  # 1. Redis Caching Service (Chay noi bo trong Docker Compose)
  redis:
    image: redis:7-alpine
    container_name: local_redis
    networks:
      - ecommerce_local_net

  # 2. Backend Express.js
  backend:
    build:
      context: ./ecommerce_backend
      dockerfile: Dockerfile
    container_name: local_backend
    environment:
      - PORT=5000
      # Su dung database MongoDB Atlas cua ban (Thay bang thong tin cua ban)
      - MONGO_URI=mongodb+srv://<YOUR_MONGODB_USERNAME>:<YOUR_MONGODB_PASSWORD>@cluster0.xxxx.mongodb.net/<YOUR_DATABASE_NAME>
      # Kết nối nội bộ với Redis container thông qua tên dịch vụ 'redis'
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=YOUR_JWT_SECRET_KEY
      - JWT_REFRESH_SECRET=YOUR_JWT_REFRESH_SECRET_KEY
      - GOOGLE_CLIENT_ID=YOUR_GOOGLE_CLIENT_ID
      - CLOUDINARY_NAME=YOUR_CLOUDINARY_NAME
      - CLOUDINARY_KEY=YOUR_CLOUDINARY_KEY
      - CLOUDINARY_SECRET=YOUR_CLOUDINARY_SECRET
      - VNP_TMN_CODE=YOUR_VNP_TMN_CODE
      - VNP_HASH_SECRET=YOUR_VNP_HASH_SECRET
      - VNP_RETURN_URL=http://localhost:5000/api/payment/vnpay_return
      - VNP_IPN_URL=http://localhost:5000/api/payment/vnpay_ipn
    depends_on:
      - redis # Đảm bảo Redis khởi động trước Backend
    networks:
      - ecommerce_local_net

  # 3. Chatbot AI FastAPI
  chatbot:
    build:
      context: ./chatbotAI
      dockerfile: Dockerfile
    container_name: local_chatbot
    networks:
      - ecommerce_local_net

  # 4. Static Admin Web Panel Vue 3 (Host tren cong 8080 - Cổng vào duy nhất của hệ thống)
  admin_web:
    build:
      context: ./ecommerce_admin_FE
      dockerfile: Dockerfile
    container_name: local_admin_web
    ports:
      - "8080:80"
    depends_on:
      - backend
      - chatbot # Đảm bảo Chatbot cũng khởi chạy trước
    networks:
      - ecommerce_local_net

networks:
  ecommerce_local_net:
    driver: bridge
